services:
  - type: web
    name: agentic-honeypot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.routes:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HONEYPOT_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
